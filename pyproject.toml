[project]
name = "roomscan"
version = "0.1.0"
description = "Phone capture (photo / video / LiDAR) to dimensioned, stitched floor plans with confidence intervals"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "jsonschema>=4.21",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
roomscan = "roomscan.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
